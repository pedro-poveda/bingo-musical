[project]
name = "bingo-musical"
version = "0.1.0"
description = "Genera cartones de bingo musical en PDF a partir de listas de Spotify"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
]

[project.scripts]
bingo-musical = "bingo_musical.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bingo_musical"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pypdf>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
